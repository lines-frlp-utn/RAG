services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: usuarios_db
    volumes:
      - ./volumes/mysql_data/users:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD || exit 1"]

  users_db:
    build:
      context: users/
      dockerfile: Dockerfile
    container_name: users_db
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql_db:3306/usuarios_db
    ports:
      - "8009:8009"


networks:
  default:
    name: lines-network