version: '3'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    environment:
      - MODEL_URL=http://model-llama
      - MODEL_PORT=8007
    volumes:
      - rag-volume:/app/database
    networks:
      - lines-network

  model-llama:
    image: llama3
    build:
      context: llm_models/llama3
      dockerfile: Dockerfile
    ports:
      - 8007:8007
    networks:
      - lines-network

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


networks:
  lines-network:
    driver: bridge

volumes:
  rag-volume:
    driver: local