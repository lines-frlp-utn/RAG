services:

  app:
    build:
      context: chainlit_app/
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    env_file:
      - chainlit_app/.env
    environment:
      - MODEL_URL=http://model-llama
      - MODEL_PORT=8007
    volumes:
      - rag-volume:/chainlit_app/database
    networks:
      - lines-network

  model-llama:
    image: llama3
    build:
      context: llm_models/llama3
      dockerfile: Dockerfile
    ports:
      - 8007:8007
    networks:
      - lines-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  db-milvus:
    image: milvus
    build:
      context: vectordbs/Chroma
      dockerfile: Dockerfile
    ports:
      - 8006:8006
    networks:
      - lines-network

networks:
  lines-network:
    driver: bridge

volumes:
  rag-volume:
    driver: local
